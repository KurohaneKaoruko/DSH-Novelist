name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 目录式路线（DSH ≤ 0.1.6）：钉版内核 0.1.2-rc.1，目录复制安装。
  verify-legacy:
    name: 目录式路线冒烟（0.1.2）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装钉版 dsh 内核
        run: npm run kernel:install
      - name: 目录式 ACP 冒烟（roster/挂载/skills 硬断言）
        run: npm run verify:kernel
      - name: 交互式 ACP 冒烟
        run: npm run verify:acp

  # bundle 路线（DSH ≥ 0.1.7，含 0.2.x）：file: 依赖装进 profile，声明式预设。
  verify-bundle:
    name: bundle 路线冒烟（0.2.0）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 bundle 验证内核
        run: npm run kernel:install:bundle
      - name: bundle 路线冒烟（roster/诊断/skills 硬断言）
        run: npm run verify:bundle

  # WebUI 服务 + 工程模板冒烟：纯 node 标准库，不需要 dsh 内核与子模块。
  verify-webui:
    name: WebUI 服务与工程模板冒烟
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebUI 服务 + 工程模板冒烟
        run: npm run verify:webui
